{% extends "main/base.html" %}
{% load main_extras %}

{% block title %}Задачи{% endblock %}

{% block content %}
    <h1>Список задач</h1>

    {% for task in tasks %}
        <p>{{ task|capitalize }}</p>
    {% empty %}
        <p>Нет задач</p>
    {% endfor %}

    <p>Текущая дата и время: {% now "Y-m-d H:i" %}</p>
{% endblock %}

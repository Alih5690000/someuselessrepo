<!doctype html>
<html lang="ru">
<head>
    {% load main_extras %}
    <meta charset="utf-8">
    <title>Задачи</title>
</head>
<body>
    <h1>Список задач</h1>

    {% for task in tasks %}
        <p>{{ task|capitalize }}</p>
    {% empty %}
        <p>Нет задач</p>
    {% endfor %}

    <p>Текущая дата и время: {% now "Y-m-d H:i" %}</p>
</body>
</html>
